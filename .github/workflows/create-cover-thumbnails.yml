name: Create cover thumbnails

on:
  push:
    paths:
      - ".github/workflows/create-cover-thumbnails.yml"
      - "assets/covers/how-to-design-an-emotion/cover.jpg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crop-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create front and back cover images
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          src="assets/covers/how-to-design-an-emotion/cover.jpg"
          w=$(identify -format "%w" "$src")
          h=$(identify -format "%h" "$src")
          back_w=$((w * 49 / 100))
          front_x=$((w * 51 / 100))
          front_w=$((w - front_x))
          convert "$src" -crop "${back_w}x${h}+0+0" +repage -quality 90 assets/covers/how-to-design-an-emotion/back-cover.jpg
          convert "$src" -crop "${front_w}x${h}+${front_x}+0" +repage -quality 90 assets/covers/how-to-design-an-emotion/front-cover.jpg
      - name: Commit generated covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/covers/how-to-design-an-emotion/front-cover.jpg assets/covers/how-to-design-an-emotion/back-cover.jpg
          git diff --cached --quiet || git commit -m "Create individual front and back cover images"
          git push
